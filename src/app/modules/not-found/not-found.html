<div class="not-found-container">
  

  <div class="code">404</div>

  <h1 class="title">Page non trouvée</h1>

  <p class="subtitle">
    La page que vous recherchez n'existe pas ou vous n'avez pas accès.
  </p>

  <div class="actions">
    <button mat-raised-button class="btn-dashboard" (click)="goToDashboard()">
      <mat-icon>dashboard</mat-icon>
      Retour au Dashboard
    </button>
    <button mat-stroked-button class="btn-logout" (click)="logout()">
      <mat-icon>logout</mat-icon>
      Se déconnecter
    </button>
  </div>
</div>
