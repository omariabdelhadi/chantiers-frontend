<h2 mat-dialog-title>{{ isEdit ? 'Modifier le rapport' : 'Nouveau rapport' }}</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="dialog-form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Titre</mat-label>
      <input matInput formControlName="titre" placeholder="Titre du rapport">
      @if (form.get('titre')?.invalid && form.get('titre')?.touched) {
        <mat-error>Le titre est requis (min. 2 caractères)</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Contenu</mat-label>
      <textarea
        matInput
        formControlName="contenu"
        rows="6"
        placeholder="Décrivez l'avancement des travaux..."
      ></textarea>
      @if (form.get('contenu')?.invalid && form.get('contenu')?.touched) {
        <mat-error>Le contenu est requis (min. 5 caractères)</mat-error>
      }
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Annuler</button>
  <button mat-raised-button color="primary" [disabled]="form.invalid" (click)="confirm()">
    {{ isEdit ? 'Modifier' : 'Créer' }}
  </button>
</mat-dialog-actions>

<style>
  .dialog-form { display: flex; flex-direction: column; gap: 8px; min-width: 460px; padding-top: 8px; }
  .full-width { width: 100%; }
</style>
