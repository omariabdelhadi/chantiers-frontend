<div class="gallery-section">
  <div class="section-header">
    <h2 class="section-title">
      <mat-icon>photo_library</mat-icon>
      Photos
    </h2>
    @if (canUpload()) {
      <button
        mat-raised-button
        color="primary"
        [disabled]="uploading"
        (click)="fileInput.click()"
      >
        <mat-icon>upload</mat-icon>
        {{ uploading ? 'Upload en cours...' : 'Ajouter une photo' }}
      </button>
      <input
        #fileInput
        type="file"
        accept="image/*"
        style="display:none"
        (change)="onFileSelected($event, fileInput)"
      >
    }
  </div>

  @if (loading) {
    <div class="loading-wrapper">
      <mat-spinner diameter="32"></mat-spinner>
    </div>
  } @else if (photos.length === 0) {
    <p class="empty-message">
      <mat-icon>image_not_supported</mat-icon>
      Aucune photo
    </p>
  } @else {
    <div class="photo-grid">
      @for (photo of photos; track photo.id; let i = $index) {
        <div class="photo-card" (click)="openLightbox(i)" matTooltip="Agrandir">
          <img
            [src]="'/uploads/' + photo.nomFichier"
            [alt]="photo.nomFichier"
            class="photo-img"
          >
          @if (canUpload()) {
            <button
              mat-icon-button
              color="warn"
              class="delete-btn"
              (click)="deletePhoto(photo.id); $event.stopPropagation()"
              matTooltip="Supprimer"
            >
              <mat-icon>delete</mat-icon>
            </button>
          }
        </div>
      }
    </div>
  }
</div>
